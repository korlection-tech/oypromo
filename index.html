<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korlection｜韓國9月份代購</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --blue: #1d63ff;
            --blue-dark: #0b4ad4;
            --pink: #ff4f91;
            --pink-dark: #e91e63;
            --yellow: #ffd83d;
            --ink: #182033;
            --muted: #64748b;
            --white: #ffffff;
            --line: #e7eaf2;
        }

        * {
            box-sizing: border-box;
        }

        body {
            position: relative;
            min-height: 100vh;
            margin: 0;
            padding: 32px 20px;
            overflow-x: hidden;
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, sans-serif;
            line-height: 1.3;
            background:
                radial-gradient(circle at 7% 8%, rgba(255, 213, 69, 0.88) 0 11%, transparent 29%),
                radial-gradient(circle at 91% 14%, rgba(252, 156, 196, 0.53) 0 12%, transparent 30%),
                radial-gradient(circle at 86% 88%, rgba(143, 195, 255, 0.58) 0 13%, transparent 34%),
                radial-gradient(circle at 9% 89%, rgba(201, 168, 255, 0.48) 0 10%, transparent 31%),
                linear-gradient(135deg, #fff7c7 0%, #ffe8ee 41%, #eef6ff 100%);
        }

        body::before,
        body::after {
            position: fixed;
            z-index: -1;
            display: block;
            border-radius: 999px;
            content: "";
            filter: blur(10px);
            pointer-events: none;
        }

        body::before {
            top: 26%;
            left: -100px;
            width: 250px;
            height: 250px;
            background: rgba(255, 180, 207, 0.34);
        }

        body::after {
            right: -120px;
            bottom: 18%;
            width: 300px;
            height: 300px;
            background: rgba(116, 182, 255, 0.26);
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 36px;
            border: 1px solid rgba(255, 255, 255, 0.82);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.80);
            box-shadow:
                0 24px 55px rgba(89, 73, 121, 0.16),
                inset 0 1px 0 rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
        }

        .header-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            text-align: center;
        }

        .korlection-logo {
            width: 140px;
            height: 140px;
            border: 4px solid #fff;
            border-radius: 50%;
            object-fit: cover;
            background: #fff;
            box-shadow:
                0 10px 25px rgba(44, 53, 78, 0.16),
                0 0 0 7px rgba(255, 255, 255, 0.38);
        }

        .partner-logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin: 4px 0 0;
        }

        .oy-logo {
            width: auto;
            height: 22px;
            object-fit: contain;
        }

        .daiso-logo {
            width: auto;
            height: 56px;
            object-fit: contain;
        }

        .title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
        }

        .flag-icon {
            width: 36px;
            height: 26px;
            border-radius: 4px;
            object-fit: contain;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.14);
        }

        h1 {
            display: inline-block;
            margin: 0;
            background: linear-gradient(135deg, #195eff 0%, #ed3f87 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .subtitle {
            margin: 0;
            padding: 8px 17px;
            border: 1px solid rgba(255, 128, 174, 0.20);
            border-radius: 999px;
            color: #a83b68;
            background: linear-gradient(
                135deg,
                rgba(255, 243, 183, 0.86),
                rgba(255, 218, 232, 0.88)
            );
            box-shadow: 0 4px 12px rgba(199, 96, 139, 0.09);
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .status-message {
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
        }

        .status-loading {
            color: #856404;
            border: 1px solid #ffe6a3;
            background: #fff8d8;
        }

        .status-error {
            color: #8c2440;
            border: 1px solid #ffc6d4;
            background: #fff0f4;
        }

        .store-tabs-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .store-tab-btn {
            flex: 1;
            max-width: 280px;
            padding: 14px 18px;
            border-radius: 13px;
            cursor: pointer;
            font-size: 20px;
            font-weight: 800;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }

        .store-tab-btn:hover {
            transform: translateY(-2px);
        }

        #tabOlive {
            border: 2px solid var(--blue);
            color: var(--blue);
            background: #eef4ff;
        }

        #tabOlive.active {
            border-color: var(--blue);
            color: #fff;
            background: linear-gradient(135deg, #2873ff, #1658df);
            box-shadow: 0 7px 17px rgba(29, 99, 255, 0.28);
        }

        #tabDaiso {
            border: 2px solid #e4002b;
            color: #e4002b;
            background: #fff0f2;
        }

        #tabDaiso.active {
            border-color: #e4002b;
            color: #fff;
            background: linear-gradient(135deg, #f3395c, #d90731);
            box-shadow: 0 7px 17px rgba(228, 0, 43, 0.24);
        }

        .category-section,
        .search-box {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid rgba(222, 227, 239, 0.96);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.82);
            box-shadow: 0 7px 18px rgba(68, 78, 110, 0.05);
        }

        .category-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: #1a202c;
            font-size: 15px;
            font-weight: bold;
        }

        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .cat-btn {
            padding: 8px 18px;
            border: 2px solid #d5ddeb;
            border-radius: 20px;
            cursor: pointer;
            color: #52627b;
            background: #fff;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.18s ease;
            user-select: none;
        }

        .cat-btn:hover {
            border-color: var(--blue);
            color: var(--blue);
        }

        .cat-btn.selected {
            border-color: var(--blue);
            color: #fff;
            background: linear-gradient(135deg, #3179ff, #1556dc);
            box-shadow: 0 4px 10px rgba(29, 99, 255, 0.18);
        }

        .brand-filter-box {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
            padding: 12px;
            border: 1px dashed #aab8ce;
            border-radius: 11px;
            background: rgba(255, 255, 255, 0.85);
        }

        .brand-chip {
            padding: 6px 14px;
            border: 1px solid #d6ddeb;
            border-radius: 7px;
            cursor: pointer;
            color: #45556c;
            background: #f5f7fb;
            font-size: 13px;
            font-weight: 700;
        }

        .brand-chip.active {
            border-color: var(--pink);
            color: #fff;
            background: linear-gradient(135deg, #ff609e, #f12e7b);
        }

        .search-box {
            background: rgba(255, 255, 255, 0.92);
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #1e293b;
            font-size: 15px;
            font-weight: 700;
        }

        textarea {
            width: 100%;
            height: 70px;
            padding: 12px;
            border: 2px solid #d3dbe9;
            border-radius: 11px;
            resize: vertical;
            color: #1f2937;
            background: #fff;
            font-family: inherit;
            font-size: 15px;
        }

        textarea:focus {
            border-color: var(--blue);
            outline: none;
            box-shadow: 0 0 0 4px rgba(29, 99, 255, 0.11);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .btn-search,
        .btn-ig-gen {
            padding: 14px;
            border: none;
            border-radius: 11px;
            cursor: pointer;
            color: #fff;
            font-size: 16px;
            font-weight: 800;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .btn-search:hover:not(:disabled),
        .btn-ig-gen:hover {
            transform: translateY(-2px);
        }

        .btn-search {
            flex: 2;
            background: linear-gradient(135deg, #2873ff, #1657dc);
            box-shadow: 0 6px 14px rgba(29, 99, 255, 0.21);
        }

        .btn-search:disabled {
            cursor: not-allowed;
            background: #aab6ca;
            box-shadow: none;
        }

        .btn-ig-gen {
            display: none;
            flex: 1;
            background: linear-gradient(135deg, #ff5c9b, #ec2875);
            box-shadow: 0 6px 14px rgba(236, 40, 117, 0.20);
        }

        .results-count {
            margin-bottom: 15px;
            color: #24334b;
            font-size: 16px;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 20px;
        }

        .card {
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow: hidden;
            border: 1px solid #e4e9f2;
            border-radius: 18px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 5px 13px rgba(44, 57, 91, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 26px rgba(35, 52, 87, 0.13);
        }

        .image-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 180px;
            margin-bottom: 12px;
            border-radius: 12px;
            background: linear-gradient(145deg, #fafcff, #f4f7fc);
        }

        .card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .card-top-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .brand-badge {
            padding: 4px 8px;
            border-radius: 6px;
            color: #40516a;
            background: #eef2f8;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .category-badge {
            color: #70809a;
            font-size: 11px;
            font-weight: 700;
        }

        .product-name {
            height: 38px;
            margin: 0 0 6px;
            overflow: hidden;
            color: #0f172a;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.35;
        }

        .prices-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px dashed #e1e7f0;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .price-row.p1 {
            color: #e11d48;
            font-weight: bold;
        }

        .price-row.p2 {
            color: #475569;
        }

        .date-label {
            color: #64748b;
            font-size: 11px;
        }

        .price-val {
            font-weight: 800;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            background: rgba(16, 24, 40, 0.68);
            transition: opacity 0.2s;
        }

        .modal-overlay.active {
            pointer-events: auto;
            opacity: 1;
        }

        .modal-content {
            position: relative;
            width: 90%;
            max-width: 550px;
            max-height: 85vh;
            padding: 25px;
            overflow-y: auto;
            border-radius: 22px;
            background: #fff;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.24);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            color: #666;
            background: #f1f5f9;
            font-size: 28px;
        }

        /* IG 1080 x 1350 poster */

        #renderCanvasHidden {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 1080px;
            height: 1350px;
            background: #fff !important;
        }

        .ig-poster-1350 {
            position: relative;
            display: grid;
            grid-template-columns: 540px 540px;
            grid-template-rows: 675px 675px;
            width: 1080px;
            height: 1350px;
            background: #fff !important;
        }

        .ig-grid-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 540px;
            height: 675px;
            overflow: hidden;
            border: none !important;
            background: #fff !important;
        }

        .ig-grid-item img {
            display: block;
            width: auto !important;
            height: auto !important;
            max-width: 82% !important;
            max-height: 65% !important;
            margin: auto;
            object-fit: contain !important;
        }

        .ig-tag-title {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
            display: -webkit-box;
            overflow: hidden;
            padding: 10px 14px;
            border: none !important;
            border-radius: 0;
            color: #000 !important;
            background: #fff !important;
            background-color: #fff !important;
            box-shadow: none !important;
            font-size: 20px;
            font-weight: 800;
            line-height: 1.3;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        .ig-tag-price-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 8px 22px;
            border: none !important;
            border-radius: 0;
            transform: translateX(-50%);
            color: #000;
            background: #fff !important;
            background-color: #fff !important;
            box-shadow: none !important;
            text-align: center;
            white-space: nowrap;
        }

        .ig-price-line.highlight {
            color: #e11d48 !important;
            font-size: 24px;
            font-weight: 900;
            line-height: 1.1;
        }

        .ig-price-line.sub {
            color: #475569 !important;
            font-size: 18px;
            font-weight: 700;
            line-height: 1.1;
        }

        .ig-center-brand {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 20;
            padding: 10px 30px;
            border: none !important;
            border-radius: 16px;
            transform: translate(-50%, -50%);
            color: #fff !important;
            background: #e98fa3 !important;
            background-color: #e98fa3 !important;
            box-shadow: none !important;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
            text-align: center;
            text-transform: uppercase;
            white-space: nowrap;
        }

        @media (max-width: 700px) {
            body {
                padding: 16px 10px;
            }

            .container {
                padding: 22px 16px;
                border-radius: 20px;
            }

            .korlection-logo {
                width: 120px;
                height: 120px;
            }

            .store-tabs-container,
            .btn-group {
                flex-direction: column;
            }

            .store-tab-btn {
                max-width: none;
            }

            h1 {
                font-size: 28px;
            }

            .subtitle {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header-section">
            <img
                src="logo.png"
                alt="Korlection Logo"
                class="korlection-logo"
                onerror="this.src='logo.jpg';"
            >

            <div class="partner-logos">
                <img
                    src="olive_young_logo.svg"
                    alt="Olive Young Logo"
                    class="oy-logo"
                    onerror="this.style.display='none';"
                >

                <img
                    src="daiso_logo.png"
                    alt="Daiso Logo"
                    class="daiso-logo"
                    onerror="this.src='daisologo.jpg';"
                >
            </div>

            <div class="title-container">
                <img
                    src="https://flagcdn.com/w80/kr.png"
                    alt="Korea Flag"
                    class="flag-icon"
                >
                <h1>Korlection</h1>
            </div>

            <p class="subtitle">🇰🇷 韓國9月份代購</p>
        </div>

        <div id="statusMessage" class="status-message status-loading">
            正在載入產品資料……
        </div>

        <div class="store-tabs-container">
            <button
                class="store-tab-btn active"
                id="tabOlive"
                onclick="switchStore('olive')"
            >
                Olive Young
            </button>

            <button
                class="store-tab-btn"
                id="tabDaiso"
                onclick="switchStore('daiso')"
            >
                Daiso
            </button>
        </div>

        <div class="category-section">
            <div class="category-title">
                <span>Category</span>
                <span style="font-size:12px; color:#64748B; font-weight:normal;">
                    可選多個分類
                </span>
            </div>

            <div class="category-tabs" id="categoryTabs">
                <div class="cat-btn selected" data-cat="all" onclick="toggleCategory('all')">All</div>
                <div class="cat-btn" data-cat="cosmetics" onclick="toggleCategory('cosmetics')">Cosmetics</div>
                <div class="cat-btn" data-cat="skincare" onclick="toggleCategory('skincare')">Skincare</div>
                <div class="cat-btn" data-cat="bodycare" onclick="toggleCategory('bodycare')">Bodycare</div>
                <div class="cat-btn" data-cat="haircare" onclick="toggleCategory('haircare')">Haircare</div>
                <div class="cat-btn" data-cat="supplement" onclick="toggleCategory('supplement')">Supplement</div>
                <div class="cat-btn" data-cat="snacks" onclick="toggleCategory('snacks')">Snacks</div>
            </div>

            <div class="brand-filter-box" id="brandFilterBox"></div>
        </div>

        <div class="search-box">
            <label for="searchInput">搜尋品牌或產品名稱</label>

            <textarea
                id="searchInput"
                placeholder="例如：AMUSE / Rom&nd / Lip / Blush"
            ></textarea>

            <div class="btn-group">
                <button
                    class="btn-search"
                    id="searchBtn"
                    onclick="performSearch()"
                    disabled
                >
                    搜尋商品
                </button>

                <button
                    class="btn-ig-gen"
                    id="igGenBtn"
                    onclick="generateAllIGPosters()"
                >
                    Generate IG
                </button>
            </div>
        </div>

        <div class="results-count" id="resultsCount"></div>
        <div class="grid" id="resultsGrid"></div>
    </div>

    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <button
                class="close-btn"
                onclick="document.getElementById('detailModal').classList.remove('active')"
            >
                ×
            </button>

            <img
                src=""
                id="modalImg"
                style="width:100%; max-height:300px; object-fit:contain; margin-bottom:15px;"
                alt="Product detail"
            >

            <div
                id="modalBrand"
                style="font-size:12px; font-weight:bold; color:#1D63FF;"
            >
                BRAND
            </div>

            <h2 id="modalTitle" style="font-size:18px; margin:5px 0 15px;"></h2>

            <div
                id="modalPrices"
                style="padding:15px; border-radius:8px; background:#FFF5F5;"
            ></div>
        </div>
    </div>

    <div id="renderCanvasHidden">
        <div class="ig-poster-1350" id="igPostTemplate">
            <div class="ig-center-brand" id="igBrandTag">BRAND</div>

            <div class="ig-grid-item" id="igCell0"></div>
            <div class="ig-grid-item" id="igCell1"></div>
            <div class="ig-grid-item" id="igCell2"></div>
            <div class="ig-grid-item" id="igCell3"></div>
        </div>
    </div>

    <script>
        let productsData = [];
        let currentStore = "olive";
        let selectedCategories = ["all"];
        let selectedBrand = "all";
        let isDefaultState = true;

        const categoryColors = {
            cosmetics: "#F19DA9",
            skincare: "#4A90E2",
            bodycare: "#9B51E0",
            haircare: "#9B51E0",
            supplement: "#F2994A",
            snacks: "#F2C94C",
            default: "#E98FA3"
        };

        document.addEventListener("keydown", function(event) {
            if (event.ctrlKey && event.shiftKey && event.key.toLowerCase() === "g") {
                event.preventDefault();
                document.getElementById("igGenBtn").style.display = "block";
                alert("已顯示 Generate IG 按鈕。");
            }
        });

        document.addEventListener("DOMContentLoaded", function() {
            const cacheBuster = "?v=" + new Date().getTime();

            Papa.parse("olive_pricelist.csv" + cacheBuster, {
                download: true,
                header: true,
                skipEmptyLines: true,

                complete: function(results) {
                    productsData = results.data || [];

                    document.getElementById("statusMessage").style.display = "none";

                    const searchButton = document.getElementById("searchBtn");
                    searchButton.disabled = false;
                    searchButton.innerText = "搜尋商品";

                    applyFilter();
                },

                error: function() {
                    const statusMessage = document.getElementById("statusMessage");

                    statusMessage.className = "status-message status-error";
                    statusMessage.innerText =
                        "無法讀取 olive_pricelist.csv。請確認 HTML 與 CSV 放在同一個資料夾，並以網站 server 開啟。";
                }
            });
        });

        function normalizeText(value) {
            return String(value || "").trim();
        }

        function normalizeLower(value) {
            return normalizeText(value).toLowerCase();
        }

        function isTrueValue(value) {
            return ["y", "yes", "1", "true"].includes(normalizeLower(value));
        }

        function switchStore(store) {
            currentStore = store;

            document
                .getElementById("tabOlive")
                .classList.toggle("active", store === "olive");

            document
                .getElementById("tabDaiso")
                .classList.toggle("active", store === "daiso");

            applyFilter();
        }

        function toggleCategory(category) {
            isDefaultState = false;

            if (category === "all") {
                selectedCategories = ["all"];
            } else {
                selectedCategories = selectedCategories.filter(function(item) {
                    return item !== "all";
                });

                if (selectedCategories.includes(category)) {
                    selectedCategories = selectedCategories.filter(function(item) {
                        return item !== category;
                    });
                } else {
                    selectedCategories.push(category);
                }

                if (selectedCategories.length === 0) {
                    selectedCategories = ["all"];
                }
            }

            document.querySelectorAll("#categoryTabs .cat-btn").forEach(function(button) {
                const categoryName = button.getAttribute("data-cat");

                button.classList.toggle(
                    "selected",
                    selectedCategories.includes(categoryName)
                );
            });

            selectedBrand = "all";
            updateBrandChips();
            applyFilter();
        }

        function updateBrandChips() {
            const box = document.getElementById("brandFilterBox");

            box.innerHTML = "";

            if (selectedCategories.includes("all")) {
                box.style.display = "none";
                return;
            }

            const filteredProducts = productsData.filter(function(product) {
                const storeMatch = normalizeLower(product["Store"]) === currentStore;

                const categoryMatch = selectedCategories.includes(
                    normalizeLower(product["Category"])
                );

                return storeMatch && categoryMatch;
            });

            const brands = [...new Set(
                filteredProducts
                    .map(function(product) {
                        return normalizeText(product["Brand"]);
                    })
                    .filter(Boolean)
            )];

            if (brands.length === 0) {
                box.style.display = "none";
                return;
            }

            box.style.display = "flex";

            const allChip = document.createElement("div");
            allChip.className = "brand-chip active";
            allChip.innerText = "All";

            allChip.onclick = function() {
                document.querySelectorAll(".brand-chip").forEach(function(chip) {
                    chip.classList.remove("active");
                });

                allChip.classList.add("active");
                selectedBrand = "all";
                applyFilter();
            };

            box.appendChild(allChip);

            brands.forEach(function(brand) {
                const chip = document.createElement("div");

                chip.className = "brand-chip";
                chip.innerText = brand;

                chip.onclick = function() {
                    document.querySelectorAll(".brand-chip").forEach(function(item) {
                        item.classList.remove("active");
                    });

                    chip.classList.add("active");
                    selectedBrand = brand.toLowerCase();

                    applyFilter();
                };

                box.appendChild(chip);
            });
        }

        function getFilteredProducts() {
            return productsData.filter(function(product) {
                if (normalizeLower(product["Store"]) !== currentStore) {
                    return false;
                }

                if (
                    isDefaultState &&
                    selectedCategories.includes("all") &&
                    selectedBrand === "all"
                ) {
                    return isTrueValue(product["Featured"]);
                }

                if (!selectedCategories.includes("all")) {
                    if (
                        !selectedCategories.includes(
                            normalizeLower(product["Category"])
                        )
                    ) {
                        return false;
                    }
                }

                if (selectedBrand !== "all") {
                    if (normalizeLower(product["Brand"]) !== selectedBrand) {
                        return false;
                    }
                }

                return true;
            });
        }

        function applyFilter() {
            const filteredProducts = getFilteredProducts();

            document.getElementById("resultsCount").innerText =
                `共 ${filteredProducts.length} 件商品`;

            renderGrid(filteredProducts);
        }

        function performSearch() {
            const keywordText = normalizeLower(
                document.getElementById("searchInput").value
            );

            if (!keywordText) {
                applyFilter();
                return;
            }

            isDefaultState = false;

            const keywords = keywordText.split(/\s+/).filter(Boolean);

            const filteredProducts = productsData.filter(function(product) {
                if (normalizeLower(product["Store"]) !== currentStore) {
                    return false;
                }

                const brand = normalizeLower(product["Brand"]);
                const name = normalizeLower(product["Product Name"]);

                return keywords.every(function(keyword) {
                    return brand.includes(keyword) || name.includes(keyword);
                });
            });

            document.getElementById("resultsCount").innerText =
                `🔍 關鍵字搜尋結果：共 ${filteredProducts.length} 件商品`;

            renderGrid(filteredProducts);
        }

        function parseCsvDate(value) {
            if (!value) {
                return null;
            }

            const text = String(value).trim();
            let match = text.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);

            if (match) {
                return new Date(
                    Number(match[1]),
                    Number(match[2]) - 1,
                    Number(match[3])
                );
            }

            match = text.match(/^(\d{1,2})\/(\d{1,2})$/);

            if (match) {
                return new Date(
                    new Date().getFullYear(),
                    Number(match[1]) - 1,
                    Number(match[2])
                );
            }

            const parsedDate = new Date(text);

            return Number.isNaN(parsedDate.getTime()) ? null : parsedDate;
        }

        function formatSaleDate(date) {
            if (!date) {
                return "";
            }

            return `${date.getDate()}/${date.getMonth() + 1}`;
        }

        function nextDay(date) {
            const result = new Date(date);

            result.setDate(result.getDate() + 1);

            return result;
        }

        function buildValidityText(item) {
            const date1 = parseCsvDate(item["Price 1 Date"]);
            const date2 = parseCsvDate(item["Price 2 Date"]);

            let price1Text = "";
            let price2Text = "";

            if (date1) {
                price1Text = `(~${formatSaleDate(date1)})`;
            }

            if (date1 && date2) {
                price2Text =
                    `(${formatSaleDate(nextDay(date1))}~${formatSaleDate(date2)})`;
            } else if (date2) {
                price2Text = `(~${formatSaleDate(date2)})`;
            }

            return {
                price1Text: price1Text,
                price2Text: price2Text
            };
        }

        function renderGrid(list) {
            const grid = document.getElementById("resultsGrid");

            grid.innerHTML = "";

            if (list.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column:1/-1; text-align:center; color:#94A3B8; padding:40px;">
                        沒有找到相關商品。
                    </div>
                `;

                return;
            }

            list.forEach(function(item) {
                const brand = item["Brand"] || "K-BEAUTY";
                const name = item["Product Name"] || "無品名";
                const category = item["Category"] || "";
                const price1 =
                    item["Price 1 (HKD)"] ||
                    item["Price (HKD)"] ||
                    "未定價";

                const price2 = item["Price 2 (HKD)"] || "";
                const image = item["Image"] || "";
                const validity = buildValidityText(item);

                const card = document.createElement("div");

                card.className = "card";

                card.onclick = function() {
                    openModal(
                        brand,
                        name,
                        item["Detail Image"] || image,
                        price1,
                        price2,
                        item["Price 1 Date"],
                        item["Price 2 Date"]
                    );
                };

                let priceHtml = `
                    <div class="price-row p1">
                        <span class="date-label">
                            ${validity.price1Text || "優惠價"}
                        </span>
                        <span class="price-val">
                            HKD $${price1}
                        </span>
                    </div>
                `;

                if (price2 && String(price2).trim() !== "") {
                    priceHtml += `
                        <div class="price-row p2">
                            <span class="date-label">
                                ${validity.price2Text || "第二階段"}
                            </span>
                            <span class="price-val">
                                HKD $${price2}
                            </span>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="image-container">
                        <img
                            src="${image}"
                            alt="${name}"
                            onerror="this.src='https://placehold.co/200x200?text=No+Image'"
                        >
                    </div>

                    <div class="card-top-info">
                        <span class="brand-badge">${brand}</span>
                        <span class="category-badge">
                            ${category.toUpperCase()}
                        </span>
                    </div>

                    <div class="product-name">${name}</div>

                    <div class="prices-container">
                        ${priceHtml}
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function openModal(brand, name, image, price1, price2, date1, date2) {
            document.getElementById("modalImg").src = image;
            document.getElementById("modalBrand").innerText = brand;
            document.getElementById("modalTitle").innerText = name;

            const validity = buildValidityText({
                "Price 1 Date": date1,
                "Price 2 Date": date2
            });

            let priceBox = `
                <div>
                    <b>HKD $${price1}</b>
                    <span style="color:#64748B;">
                        ${validity.price1Text}
                    </span>
                </div>
            `;

            if (price2 && String(price2).trim() !== "") {
                priceBox += `
                    <div style="margin-top:5px; color:#666;">
                        <b>HKD $${price2}</b>
                        <span style="color:#64748B;">
                            ${validity.price2Text}
                        </span>
                    </div>
                `;
            }

            document.getElementById("modalPrices").innerHTML = priceBox;
            document.getElementById("detailModal").classList.add("active");
        }

        async function generateAllIGPosters() {
            const targetProducts = productsData.filter(function(product) {
                return isTrueValue(product["Generate_IG"]);
            });

            if (targetProducts.length === 0) {
                alert(
                    "⚠️ 沒有找到需要生成 IG 圖的產品！\n" +
                    "請確保 CSV 的 Generate_IG 欄位填寫 Y / YES / 1 / TRUE。"
                );

                return;
            }

            const brandMap = {};

            targetProducts.forEach(function(product) {
                const brand = normalizeText(product["Brand"]) || "K-BEAUTY";

                if (!brandMap[brand]) {
                    brandMap[brand] = [];
                }

                brandMap[brand].push(product);
            });

            const brands = Object.keys(brandMap);

            const confirmed = confirm(
                `找到 ${targetProducts.length} 件指定產品（共 ${brands.length} 個品牌）。\n\n` +
                "是否開始生成 1080 x 1350 IG 宣傳圖？"
            );

            if (!confirmed) {
                return;
            }

            for (const brandName of brands) {
                const items = brandMap[brandName];

                const mainCategory = normalizeLower(items[0]["Category"]);

                const brandColor =
                    categoryColors[mainCategory] || categoryColors.default;

                const brandTag = document.getElementById("igBrandTag");

                brandTag.innerText = brandName;
                brandTag.style.background = brandColor;
                brandTag.style.backgroundColor = brandColor;
                brandTag.style.boxShadow = "none";

                for (let index = 0; index < items.length; index += 4) {
                    const chunk = items.slice(index, index + 4);
                    const page = Math.floor(index / 4) + 1;

                    for (let cellIndex = 0; cellIndex < 4; cellIndex++) {
                        const cell = document.getElementById("igCell" + cellIndex);

                        cell.innerHTML = "";

                        const item = chunk[cellIndex];

                        if (!item) {
                            continue;
                        }

                        const name = item["Product Name"] || "";
                        const image = item["Image"] || "";

                        const price1 =
                            item["Price 1 (HKD)"] ||
                            item["Price (HKD)"] ||
                            "";

                        const price2 = item["Price 2 (HKD)"] || "";
                        const validity = buildValidityText(item);

                        let priceHtml = `
                            <div class="ig-price-line highlight">
                                $${price1} ${validity.price1Text}
                            </div>
                        `;

                        if (price2 && String(price2).trim() !== "") {
                            priceHtml += `
                                <div class="ig-price-line sub">
                                    $${price2} ${validity.price2Text}
                                </div>
                            `;
                        }

                        cell.innerHTML = `
                            <img
                                src="${image}"
                                crossorigin="anonymous"
                                style="
                                    max-width:82% !important;
                                    max-height:65% !important;
                                    width:auto !important;
                                    height:auto !important;
                                    object-fit:contain !important;
                                    display:block;
                                    margin:auto;
                                "
                                onerror="this.src='https://placehold.co/500x500?text=No+Image'"
                            >

                            <div
                                class="ig-tag-title"
                                style="
                                    background:#ffffff !important;
                                    background-color:#ffffff !important;
                                    color:#000000 !important;
                                    border:none !important;
                                    box-shadow:none !important;
                                "
                            >
                                ${name}
                            </div>

                            <div
                                class="ig-tag-price-box"
                                style="
                                    background:#ffffff !important;
                                    background-color:#ffffff !important;
                                    border:none !important;
                                    box-shadow:none !important;
                                "
                            >
                                ${priceHtml}
                            </div>
                        `;
                    }

                    await new Promise(function(resolve) {
                        setTimeout(resolve, 500);
                    });

                    const poster = document.getElementById("igPostTemplate");

                    const canvas = await html2canvas(poster, {
                        useCORS: true,
                        allowTaint: false,
                        scale: 1,
                        backgroundColor: "#ffffff",
                        logging: false
                    });

                    const link = document.createElement("a");

                    link.download =
                        `${brandName.replace(/\s+/g, "_")}` +
                        `_Part${page}_IG_1080x1350.png`;

                    link.href = canvas.toDataURL("image/png");

                    link.click();
                }
            }

            alert("🎉 指定產品的 IG 宣傳圖已全部成功生成並下載！");
        }
    </script>
