<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korlection｜韓國11月份代購</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --blue: #1d63ff;
            --pink: #ff4f91;
            --ink: #182033;
            --muted: #64748b;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 20px;
            overflow-x: hidden;
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, sans-serif;
            line-height: 1.3;
            background: linear-gradient(
                135deg,
                #fff9d2 0%,
                #fff0a8 28%,
                #ffe477 55%,
                #ffd84d 78%,
                #ffc928 100%
            );
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 36px;
            border: 1px solid rgba(255, 255, 255, 0.88);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.90);
            box-shadow:
                0 24px 55px rgba(106, 84, 18, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.95);
        }

        .header-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            text-align: center;
        }

        .korlection-logo {
            width: 140px;
            height: 140px;
            border: 4px solid #fff;
            border-radius: 50%;
            object-fit: cover;
            background: #fff;
            box-shadow:
                0 10px 25px rgba(80, 63, 15, 0.18),
                0 0 0 7px rgba(255, 255, 255, 0.38);
        }

        .title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 3px;
        }

        h1 {
            margin: 0;
            background: linear-gradient(135deg, #195eff 0%, #ed3f87 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 1px;
            line-height: 1.1;
        }

        .subtitle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 0;
            padding: 0;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 1px;
            line-height: 1.1;
        }

        .subtitle span {
            background: linear-gradient(135deg, #195eff 0%, #ed3f87 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle-flag {
            display: block;
            width: 43px;
            height: auto;
            flex: 0 0 auto;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.16);
        }

        .partner-logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin: 8px 0 0;
        }

        .oy-logo {
            width: auto;
            height: 22px;
            object-fit: contain;
        }

        .daiso-logo {
            width: auto;
            height: 56px;
            object-fit: contain;
        }

        .status-message {
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
        }

        .status-loading {
            color: #856404;
            border: 1px solid #ffe6a3;
            background: #fff8d8;
        }

        .status-error {
            color: #8c2440;
            border: 1px solid #ffc6d4;
            background: #fff0f4;
        }

        .store-tabs-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .store-tab-btn {
            flex: 1;
            max-width: 280px;
            padding: 14px 18px;
            border-radius: 13px;
            cursor: pointer;
            font-size: 20px;
            font-weight: 800;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }

        .store-tab-btn:hover {
            transform: translateY(-2px);
        }

        #tabOlive {
            border: 2px solid var(--blue);
            color: var(--blue);
            background: #eef4ff;
        }

        #tabOlive.active {
            border-color: var(--blue);
            color: #fff;
            background: linear-gradient(135deg, #2873ff, #1658df);
            box-shadow: 0 7px 17px rgba(29, 99, 255, 0.28);
        }

        #tabDaiso {
            border: 2px solid #e4002b;
            color: #e4002b;
            background: #fff0f2;
        }

        #tabDaiso.active {
            border-color: #e4002b;
            color: #fff;
            background: linear-gradient(135deg, #f3395c, #d90731);
            box-shadow: 0 7px 17px rgba(228, 0, 43, 0.24);
        }

        .category-section,
        .search-box {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid rgba(222, 227, 239, 0.96);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 7px 18px rgba(68, 78, 110, 0.05);
        }

        .category-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: #1a202c;
            font-size: 15px;
            font-weight: bold;
        }

        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .cat-btn {
            padding: 8px 18px;
            border: 2px solid #d5ddeb;
            border-radius: 20px;
            cursor: pointer;
            color: #52627b;
            background: #fff;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.18s ease;
            user-select: none;
        }

        .cat-btn:hover {
            border-color: var(--blue);
            color: var(--blue);
        }

        .cat-btn.selected {
            border-color: var(--blue);
            color: #fff;
            background: linear-gradient(135deg, #3179ff, #1556dc);
            box-shadow: 0 4px 10px rgba(29, 99, 255, 0.18);
        }

        .character-filter-box,
        .brand-filter-box {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
            padding: 12px;
            border-radius: 11px;
        }

        .character-filter-box {
            border: 1px dashed #f0a4c1;
            background: #fff8fb;
        }

        .brand-filter-box {
            border: 1px dashed #aab8ce;
            background: rgba(255, 255, 255, 0.90);
        }

        .filter-label {
            width: 100%;
            margin-bottom: 2px;
            color: #59677e;
            font-size: 12px;
            font-weight: 800;
        }

        .character-chip {
            padding: 7px 14px;
            border: 1px solid #f1b7ce;
            border-radius: 999px;
            cursor: pointer;
            color: #9d3460;
            background: #fff;
            font-size: 13px;
            font-weight: 800;
            transition: all 0.18s ease;
        }

        .character-chip:hover {
            transform: translateY(-1px);
            border-color: #f04485;
            color: #f04485;
        }

        .character-chip.active {
            border-color: #f04485;
            color: #fff;
            background: linear-gradient(135deg, #ff75aa, #f04485);
            box-shadow: 0 4px 10px rgba(240, 68, 133, 0.18);
        }

        .brand-chip {
            padding: 6px 14px;
            border: 1px solid #d6ddeb;
            border-radius: 7px;
            cursor: pointer;
            color: #45556c;
            background: #f5f7fb;
            font-size: 13px;
            font-weight: 700;
        }

        .brand-chip.active {
            border-color: var(--pink);
            color: #fff;
            background: linear-gradient(135deg, #ff609e, #f12e7b);
        }

        .search-box {
            background: rgba(255, 255, 255, 0.93);
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #1e293b;
            font-size: 15px;
            font-weight: 700;
        }

        textarea {
            width: 100%;
            height: 70px;
            padding: 12px;
            border: 2px solid #d3dbe9;
            border-radius: 11px;
            resize: vertical;
            color: #1f2937;
            background: #fff;
            font-family: inherit;
            font-size: 15px;
        }

        textarea:focus {
            border-color: var(--blue);
            outline: none;
            box-shadow: 0 0 0 4px rgba(29, 99, 255, 0.11);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .btn-search,
        .btn-ig-gen {
            padding: 14px;
            border: none;
            border-radius: 11px;
            cursor: pointer;
            color: #fff;
            font-size: 16px;
            font-weight: 800;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .btn-search:hover:not(:disabled),
        .btn-ig-gen:hover {
            transform: translateY(-2px);
        }

        .btn-search {
            flex: 2;
            background: linear-gradient(135deg, #2873ff, #1657dc);
            box-shadow: 0 6px 14px rgba(29, 99, 255, 0.21);
        }

        .btn-search:disabled {
            cursor: not-allowed;
            background: #aab6ca;
            box-shadow: none;
        }

        .btn-ig-gen {
            display: none;
            flex: 1;
            background: linear-gradient(135deg, #ff5c9b, #ec2875);
            box-shadow: 0 6px 14px rgba(236, 40, 117, 0.20);
        }

        .results-count {
